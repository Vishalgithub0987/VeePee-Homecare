<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF5F1" />
      <stop offset="100%" stop-color="#D5ECE3" />
    </linearGradient>
    <linearGradient id="tealScrubs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#237A73" />
      <stop offset="100%" stop-color="#145C59" />
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD5B5" />
      <stop offset="100%" stop-color="#F4B886" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2421" />
      <stop offset="100%" stop-color="#151210" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#145C59" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Healthcare Glow -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="#145C59" stroke-width="2.5" />

  <!-- Back Hair Bun -->
  <circle cx="60" cy="34" r="23" fill="url(#hairGrad)" />

  <!-- Neck -->
  <rect x="53" y="58" width="14" height="16" rx="4" fill="url(#skinTone)" />

  <!-- Scrubs Uniform Body -->
  <path d="M30 102 C30 78 42 70 52 70 L68 70 C78 70 90 78 90 102 Z" fill="url(#tealScrubs)" filter="url(#softGlow)" />
  
  <!-- Scrubs V-Neck Collar -->
  <polygon points="52,70 68,70 60,84" fill="#145C59" opacity="0.3" />
  <polygon points="54,70 66,70 60,82" fill="url(#skinTone)" />

  <!-- Stethoscope around neck -->
  <path d="M44 76 C44 94 76 94 76 76" fill="none" stroke="#D6B46A" stroke-width="3" stroke-linecap="round" />
  <path d="M60 88 L60 97" fill="none" stroke="#D6B46A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="100" r="4.5" fill="#FCFBF7" stroke="#145C59" stroke-width="2" />
  <circle cx="43" cy="74" r="2.5" fill="#145C59" />
  <circle cx="77" cy="74" r="2.5" fill="#145C59" />

  <!-- Face -->
  <ellipse cx="60" cy="50" rx="16" ry="18" fill="url(#skinTone)" />

  <!-- Hair Front Bangs / Hairline -->
  <path d="M44 48 C44 33 52 28 60 28 C68 28 76 33 76 48 C72 40 66 38 60 38 C54 38 48 40 44 48 Z" fill="url(#hairGrad)" />

  <!-- Friendly Eyes with sparkle -->
  <ellipse cx="54" cy="48" rx="2.2" ry="2.8" fill="#1E2A2E" />
  <circle cx="53.2" cy="47" r="0.8" fill="#FFFFFF" />
  <ellipse cx="66" cy="48" rx="2.2" ry="2.8" fill="#1E2A2E" />
  <circle cx="65.2" cy="47" r="0.8" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M51 43 Q54 41 57 43" fill="none" stroke="#2A2421" stroke-width="1.2" stroke-linecap="round" />
  <path d="M63 43 Q66 41 69 43" fill="none" stroke="#2A2421" stroke-width="1.2" stroke-linecap="round" />

  <!-- Soft Cheeks -->
  <circle cx="50" cy="53" r="3.2" fill="#F29080" opacity="0.35" />
  <circle cx="70" cy="53" r="3.2" fill="#F29080" opacity="0.35" />

  <!-- Gentle Nose -->
  <path d="M59.5 50 Q60 53 61.5 53" fill="none" stroke="#DDA273" stroke-width="1.2" stroke-linecap="round" />

  <!-- Caring Smile -->
  <path d="M55 56 Q60 61 65 56" fill="none" stroke="#B3423A" stroke-width="2" stroke-linecap="round" />

  <!-- Professional Healthcare Nurse Headband / Cap with Red/Teal Cross -->
  <path d="M46 29 C46 22 74 22 74 29 L72 35 C72 35 48 35 48 35 Z" fill="#FCFBF7" stroke="#E2EAE7" stroke-width="1" />
  <rect x="58.5" y="25" width="3" height="7" rx="0.8" fill="#145C59" />
  <rect x="56.5" y="27" width="7" height="3" rx="0.8" fill="#145C59" />

  <!-- Small Online / Ready Indicator -->
  <circle cx="92" cy="30" r="7.5" fill="#287D53" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="92" cy="30" r="3.5" fill="#FFFFFF" />
</svg>
